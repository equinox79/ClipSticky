[package]
name = "clipsticky"
version = "0.1.0"
edition = "2024"
description = "クリップボードの最新の内容を付箋のように表示する常駐アプリ"
license = "MIT"
repository = "https://github.com/equinox79/ClipSticky"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs"] }
