[package]
name = "clipsticky"
version = "0.1.1"
edition = "2024"
description = "クリップボードの最新の内容を付箋のように表示する常駐アプリ"
license = "MIT"
repository = "https://github.com/equinox79/ClipSticky"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
arboard = "3.6.1"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
muda = "0.21.2"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSGraphics"] }
objc2-foundation = "0.3"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
